; =============================================================================
;  BambuTagger-Touch — PlatformIO project                         2026-06-23
; =============================================================================
;  Target hardware:  Guition JC8048W550
;                    ESP32-S3-WROOM-1-N16R8  (16 MB flash, 8 MB OPI PSRAM)
;  Display:          5.0" 800x480 ST7262 RGB + GT911 touch
;  RFID:             RC522 on HSPI
; =============================================================================
;  Modeled after BambuTagger-Console/platformio.ini (known-good config).
; =============================================================================

[platformio]
default_envs = JC8048W550

; ── Build environment ───────────────────────────────────────────────────────
[env:JC8048W550]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino

; ── Chip / Flash / PSRAM ────────────────────────────────────────────────────
board_build.mcu                 = esp32s3
board_build.f_cpu               = 240000000L
board_build.f_flash             = 80000000L
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size         = 16MB
board_build.flash_size          = 16MB
board_build.partitions          = partitions.csv

; ── Serial / Upload ─────────────────────────────────────────────────────────
monitor_speed = 115200
upload_speed  = 460800

; ── Build flags ─────────────────────────────────────────────────────────────
build_unflags = -std=gnu++11
build_flags =
    -DBOARD_HAS_PSRAM
    -DDEBUG_SERIAL=1
    -I.
    -std=gnu++17

; ── Library dependencies ────────────────────────────────────────────────────
;   LovyanGFX                — display driver (ST7262 RGB + GT911 touch)
;   makerspaceleiden/rfid    — MFRC522 library
;   ArduinoJson              — JSON parsing
;
;   Built-in (from ESP32 Arduino framework):
;     SPI, Wire, WiFi, WebServer, HTTPClient, WiFiClientSecure,
;     Preferences, FFat, Update, mbedTLS, miniz
; ────────────────────────────────────────────────────────────────────────────
lib_deps =
    lovyan03/LovyanGFX
    https://github.com/makerspaceleiden/rfid.git
    bblanchon/ArduinoJson

; ── Debug / USB ─────────────────────────────────────────────────────────────
; The JC8048W550 uses hardware UART via CP2102 (no USB-OTG CDC).
; Leave board_build.arduino.usb_cdc commented unless you need USB-serial-jtag.

# ============================================================
#  BambuTagger-Touch — Automatic Build & Release
#  Compiles the ESP32 sketch via PlatformIO and publishes a
#  GitHub Release every time a version tag (v*) is pushed.
#  A normal push to main only compiles (smoke-test, no release).
# ============================================================

name: Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"       # v2.0.0, …
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Install Python + PlatformIO CLI ───────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      # ── 3. Cache PlatformIO packages ─────────────────────────
      - name: Cache PlatformIO data
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      # ── 4. Build ─────────────────────────────────────────────
      - name: Compile firmware
        run: pio run -e JC8048W550

      # ── 5. Install esptool for binary merge ──────────────────
      - name: Install esptool
        run: pip install esptool

      # ── 6. Create merged flashable binary ────────────────────
      - name: Create merged binary
        run: |
          BUILD=".pio/build/JC8048W550"
          BOOT="$BUILD/bootloader.bin"
          PART="$BUILD/partitions.bin"
          APP="$BUILD/firmware.bin"

          # Locate boot_app0.bin inside PlatformIO's esp32 package
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 \
            -name boot_app0.bin 2>/dev/null | head -1)

          mkdir -p build
          MERGED="build/BambuTagger-Touch_merged.bin"

          esptool.py \
            --chip esp32s3 \
            merge_bin \
            --output "$MERGED" \
            --flash_mode qio \
            --flash_freq 80m \
            --flash_size 16MB \
            0x0      "$BOOT" \
            0x8000   "$PART" \
            0xe000   "$BOOT_APP0" \
            0x10000  "$APP"

          # Copy individual binaries for artefacts
          cp "$BOOT" build/bootloader.bin
          cp "$PART" build/partitions.bin
          cp "$APP"  build/firmware.bin

          echo "=== Build artefacts ==="
          ls -lh build/

      # ── 7. Upload artefacts ──────────────────────────────────
      - name: Upload firmware artefacts
        uses: actions/upload-artifact@v4
        with:
          name: BambuTagger-Touch-firmware-${{ github.sha }}
          retention-days: 30
          path: build/

      # ── 8. Create GitHub Release (tags only) ─────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "BambuTagger-Touch ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            build/firmware.bin
            build/bootloader.bin
            build/partitions.bin
            build/BambuTagger-Touch_merged.bin
          body: |
            ## Flashing instructions

            ### Easiest — merged binary (single file, address 0x00)
            ```
            esptool.py --chip esp32s3 --port /dev/ttyUSB0 --baud 921600 \
              write_flash 0x0 BambuTagger-Touch_merged.bin
            ```

            ### Manual — three separate files
            ```
            esptool.py --chip esp32s3 --port /dev/ttyUSB0 --baud 921600 \
              write_flash \
              0x0      bootloader.bin \
              0x8000   partitions.bin \
              0x10000  firmware.bin
            ```

            > **Partition scheme:** Custom 16 MB — app0/app1 = 1408 KB, ffat = 1152 KB  
            > **Board:** Guition JC8048W550 (ESP32-S3-WROOM-1-N16R8)